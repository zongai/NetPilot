[workspace]
resolver = "2"
members = [
    "apps/core",
    "crates/core",
    "crates/ipc",
    "crates/config",
    "crates/rules",
    "crates/routing",
    "crates/proxy",
    "crates/protocols/common",
    "crates/protocols/shadowsocks",
    "crates/protocols/shadowsocksr",
    "crates/protocols/vmess",
    "crates/protocols/vless",
    "crates/protocols/trojan",
    "crates/transports/tcp",
    "crates/transports/tls",
    "crates/transports/websocket",
    "crates/transports/http2",
    "crates/transports/grpc",
    "crates/transports/reality",
    "crates/dns",
    "crates/tun",
    "crates/process",
    "crates/diagnostics",
    "crates/testkit",
    "crates/subscription",
    "crates/os-pipe",
    "crates/os-wintun",
    "crates/outbound",
    "crates/engine",
    "crates/os-route",
    "crates/netstack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zongai/NetPilot"
readme = "README.md"
rust-version = "1.98.1"

[workspace.dependencies]
# Shared dependency versions will be pinned here as crates grow.

# Workspace-wide lint policy (NP-002). Members inherit via [lints] workspace = true later.
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
# Tighten gradually in later tasks; CI uses `cargo clippy ... -- -D warnings`.
