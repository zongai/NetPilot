[package]
name = "netpilot-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "NetPilot Core — resident runtime + named-pipe IPC"

[[bin]]
name = "netpilot-core"
path = "src/main.rs"

[features]
default = ["real-http"]
real-http = ["netpilot-subscription/real-http"]

[dependencies]
netpilot-core-lib = { path = "../../crates/core" }
netpilot-ipc = { path = "../../crates/ipc" }
netpilot-os-pipe = { path = "../../crates/os-pipe" }
netpilot-proxy = { path = "../../crates/proxy" }
netpilot-rules = { path = "../../crates/rules" }
netpilot-dns = { path = "../../crates/dns" }
netpilot-tun = { path = "../../crates/tun", features = ["wintun-native"] }
netpilot-process = { path = "../../crates/process" }
netpilot-diagnostics = { path = "../../crates/diagnostics" }
netpilot-subscription = { path = "../../crates/subscription" }
netpilot-protocol-common = { path = "../../crates/protocols/common" }
netpilot-transport-tls = { path = "../../crates/transports/tls" }
netpilot-transport-tcp = { path = "../../crates/transports/tcp" }
netpilot-routing = { path = "../../crates/routing" }
netpilot-os-wintun = { path = "../../crates/os-wintun" }
netpilot-outbound = { path = "../../crates/outbound" }
netpilot-engine = { path = "../../crates/engine" }
serde_json = "1"

[lints]
workspace = true
