[package]
name = "netpilot-outbound"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Outbound dialers: direct, SOCKS5, HTTP CONNECT, Trojan, VLESS, Shadowsocks, VMess, SSR"

[lib]
path = "src/lib.rs"

[features]
default = ["tls-rustls"]
tls-rustls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dependencies]
netpilot-proxy = { path = "../proxy" }
netpilot-protocol-common = { path = "../protocols/common" }
netpilot-protocol-vmess = { path = "../protocols/vmess" }
netpilot-protocol-shadowsocksr = { path = "../protocols/shadowsocksr" }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[lints]
workspace = true
